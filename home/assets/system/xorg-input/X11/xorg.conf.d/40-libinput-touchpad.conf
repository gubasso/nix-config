Section "InputClass"
    Identifier "libinput touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"

    # Tap: single=click, double=drag, triple=middle-click
    Option "Tapping" "on"
    Option "TappingDrag" "on"
    Option "TappingDragLock" "on"
    Option "TappingButtonMap" "lrm"

    # Natural (reverse) scrolling — mobile-style
    Option "NaturalScrolling" "true"
    Option "ScrollMethod" "twofinger"

    # Physical click zones: bottom-right=right, bottom-middle=middle
    # Tap zones remain from TappingButtonMap: 2-finger tap=right, 3-finger tap=middle
    Option "ClickMethod" "buttonareas"

    # Palm/typing rejection
    Option "DisableWhileTyping" "true"

    # Disable touchpad when external mouse connected
    Option "SendEventsMode" "disabled-on-external-mouse"

    # Pointer acceleration
    Option "AccelProfile" "adaptive"
    Option "AccelSpeed" "0.35"
EndSection
