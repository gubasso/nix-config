Section "InputClass"
    Identifier "libinput trackpoint"
    MatchProduct "TPPS/2"
    MatchIsPointer "on"
    MatchIsTouchpad "off"
    Driver "libinput"

    # Middle-button scrolling (hold middle + move stick)
    Option "ScrollMethod" "button"
    Option "ScrollButton" "2"

    # Flat profile preferred for pointing sticks
    Option "AccelProfile" "flat"
    Option "AccelSpeed" "0.6"
EndSection
