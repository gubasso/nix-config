# Picom - compositor for dwm
# No visual effects; vsync + proper rendering only.

# Backend
backend = "glx";
vsync = true;

xrender-sync-fence = true;

# Performance
use-damage = true;

# Fullscreen bypass disabled — causes black flash on window map/unmap.
# Re-enable if fullscreen apps (games, video) need raw perf and flash is fixed.
unredir-if-possible = false;

# Window detection
detect-transient = true;
detect-client-opacity = true;

shadow = false;
fading = false;
# fade-in-step = 0.09;
# fade-out-step = 0.09;
