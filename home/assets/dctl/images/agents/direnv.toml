# ~/.config/direnv/direnv.toml — baked into the agents image.
#
# Trust project .envrc files non-interactively: any .envrc whose absolute path
# starts with one of these prefixes is loaded WITHOUT `direnv allow` (freshly
# bind-mounted projects auto-activate). Trailing slash = hard directory boundary
# (so /workspaces does not also match /workspaces-scratch).
# log_format is a Go format string applied as fmt.Sprintf(log_format, msg). An
# empty string disables direnv's own status logging. (A value like "-" has no
# %s verb and makes Go emit %!(MISSING)/%!(EXTRA …) garbage on every load.)
[global]
log_format = ""

[whitelist]
prefix = ["/workspaces/", "~/Projects/"]
