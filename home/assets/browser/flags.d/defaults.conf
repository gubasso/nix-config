# Keep ONLY ONE --enable-features=... and ONLY ONE --disable-features=... line.
# Multiple such lines commonly override each other on Chromium-style launchers.

--disable-session-crashed-bubble
--hide-crash-restore-bubble

## Wayland (prefer native Wayland; avoids XWayland blur / input quirks)
--ozone-platform-hint=auto
# If you confirm the browser still comes up under XWayland, uncomment the next line:
# --ozone-platform=wayland

## Features (ONE LINE)
# - WaylandWindowDecorations: improves decoration behavior on some Wayland setups
# - WebRtcPipeWireCamera: PipeWire camera/capture (renamed from WebRTCPipeWireCapturer)
# - AcceleratedVideoDecodeLinuxGL: VA-API hardware video decode (Chromium 131+)
# - VaapiVideoDecodeLinuxGL: VA-API hardware video decode (legacy name, kept for compatibility)
# - VaapiIgnoreDriverChecks: bypass driver allowlist (may be needed for Mesa 25.x)
#   NOTE: Remove VaapiIgnoreDriverChecks once VA-API is confirmed working to restore allowlist checks
--enable-features=WaylandWindowDecorations,WebRtcPipeWireCamera,AcceleratedVideoDecodeLinuxGL,VaapiVideoDecodeLinuxGL,VaapiIgnoreDriverChecks

## NVIDIA/Wayland backend choice (ONE LINE)
# Vulkan can still be problematic on NVIDIA Wayland in Chromium-family apps; keep a GL/ANGLE path by default.
# - Vulkan: Chrome's Vulkan compositor
# - DefaultANGLEVulkan/VulkanFromANGLE: ANGLE's Vulkan backend
# - disable-vulkan-surface: prevents VK_KHR_surface swapchain (fixes Dawn/WebGPU probing on Wayland)
--disable-features=Vulkan,DefaultANGLEVulkan,VulkanFromANGLE
--disable-vulkan-surface
--use-gl=angle
--use-angle=gl

## WebGPU backend selection
# Force Dawn (WebGPU) to use OpenGLES backend directly, bypassing Vulkan probing.
# This reduces Vulkan initialization errors on NVIDIA+Wayland.
--use-webgpu-adapter=opengles

## Optional (only if you *need* HW video encoding in the browser; increases power usage)
# To enable, edit the --enable-features line above and append: ,AcceleratedVideoEncoder
