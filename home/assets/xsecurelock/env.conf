# xsecurelock environment — sourced by .xinitrc before xss-lock.
# See xsecurelock(1) for all knobs.
# Also sourceable from shell: set -a; . env.conf; set +a

# --- Saver & background ---

# Use blank screen (no screensaver animation)
XSECURELOCK_SAVER=saver_blank

# Lock-screen background: Purple City bg0 (OLED true black = pixels off)
XSECURELOCK_BACKGROUND_COLOR=#010005

# --- Display power (after lock is active) ---

# BLANK_TIMEOUT=-1 disables xsecurelock's own X11 blanking call entirely;
# DPMS_STATE=on means xsecurelock will also not invoke DPMSForceLevel.
# Together with `xset -dpms` in dwm/.xinitrc (which disables the X server's
# *own* DPMS timer — the load-bearing missing piece in the May-16 fix), the
# eDP stays electrically powered while xsecurelock paints solid black; OLED
# pixels never self-emit, and the Meteor Lake C10 PHY is never parked at
# idle reference. See _docs/hosts/nova/bugs/lock-screen-black-after-idle/.
# Revert (TIMEOUT=30, DPMS_STATE=off, re-enable X DPMS) once Arch ships
# Linux 7.1+ with Intel's Cx0 suspend/resume fix series.
XSECURELOCK_BLANK_TIMEOUT=-1
XSECURELOCK_BLANK_DPMS_STATE=on

# --- Auth prompt appearance ---

# Auth dialog colors — Purple City bg1/subtext
XSECURELOCK_AUTH_BACKGROUND_COLOR=#0B0113
XSECURELOCK_AUTH_FOREGROUND_COLOR=#D9CCE8

# Font for auth prompt (Terminus bold 32px — bitmap, hacker/old-school terminal look)
# Requires: pacman -S terminus-font
XSECURELOCK_FONT=-xos4-terminus-bold-r-normal--32-*-*-*-*-*-*-*

# Hide info lines on the lock screen (minimal look, no info leak)
XSECURELOCK_SHOW_DATETIME=0
XSECURELOCK_SHOW_USERNAME=0
XSECURELOCK_SHOW_HOSTNAME=0
XSECURELOCK_SHOW_KEYBOARD_LAYOUT=0

# Show one auth window across all monitors (instead of one per screen)
XSECURELOCK_SINGLE_AUTH_WINDOW=1

# Show asterisks for each typed character (reveals password length)
XSECURELOCK_PASSWORD_PROMPT=asterisks

# --- OLED burn-in mitigation ---

# Shift the auth prompt randomly within this many pixels to avoid burn-in
# (only matters while the prompt is visible; display blanks after BLANK_TIMEOUT)
XSECURELOCK_BURNIN_MITIGATION=80
