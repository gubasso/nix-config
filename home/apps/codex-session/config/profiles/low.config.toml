# Low tier — flagship, low effort, full sandbox. Light work whose reasoning was already
# done upstream: review-loop rounds 2+ (re-checks of triaged fixes) and read-only
# cross-check Q&A (claude `ask -c`). Never for multi-step reasoning.
# Selected with `codex --profile low`.
# gpt-5.5 stays coherent at low effort where gpt-5.4 flails; cost ≈ 0.3–0.45× of the
# medium tier.

sandbox_mode = "danger-full-access"
model = "gpt-5.5"
model_reasoning_effort = "low"
plan_mode_reasoning_effort = "low"
