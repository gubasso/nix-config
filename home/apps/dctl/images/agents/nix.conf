# /etc/nix/nix.conf — baked into the agents image (single-user, daemonless).
experimental-features = nix-command flakes

# XDG Base Directory layout: the per-user profile + state live under
# ~/.local/state/nix (persisted by the dctl-nix-state named volume). This moves
# the convenience symlink to ~/.local/state/nix/profile — INSIDE that volume —
# instead of ~/.nix-profile, so the whole per-user Nix tree survives a container
# recreate and Nix installs only once. Only affects per-user $HOME files; this
# global config is unaffected. (The image also exports XDG_STATE_HOME so the
# profile.d PATH script agrees with the core — see the Dockerfile ENV.)
use-xdg-base-directories = true

# Single-user store has no nixbld build-user group; an empty value is REQUIRED
# or every build fails looking for the group.
build-users-group =

# The user-namespace build sandbox is fragile under restricted container
# security profiles; binary-cache installs don't need it.
sandbox = false

# openSUSE Tumbleweed base: Nix's fetcher probes the Debian CA path and fails
# with curl error 77 otherwise. Point it at the SUSE system bundle.
ssl-cert-file = /etc/ssl/ca-bundle.pem

# Binary caches (nix-community serves oxalica/fenix Rust toolchains prebuilt).
substituters = https://cache.nixos.org https://nix-community.cachix.org
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
