# ================================================================
# Kitty Editor Mode (ctrl+space>e)
# ================================================================
# Neovim/editor operations.
#
# kitty-scrollback.nvim (browse in nvim):
#   n = full scrollback, ctrl+n = last command
#
# Open in plain nvim buffer:
#   e = full scrollback, ctrl+e = last command
#
# Mode auto-exits immediately on keypress. Esc to cancel.
# Press ? for help.
# ================================================================


action_alias exit_editor pop_keyboard_mode

# Enter editor mode via ctrl+space prefix.
# Use {keyboard_mode} in tab_title_template to show a transient mode hint.
map --new-mode editor ctrl+space>e

# Help (exits mode first, so dismissing overlay returns to normal)
map --mode editor ? combine : exit_editor : launch --type=overlay --title=Help ~/.local/bin/kitty-mode-help kitty-editor-mode.conf

# Exit
map --mode editor esc exit_editor

# kitty-scrollback.nvim
map --mode editor ctrl+n combine : exit_editor : kitten ~/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py --config ksb_builtin_last_cmd_output
map --mode editor n combine : exit_editor : kitten ~/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py

# Open in plain nvim buffer
map --mode editor ctrl+e combine : exit_editor : launch --stdin-source=@last_cmd_output --type=overlay --title=current ~/.local/bin/nvim-scrollback lastcmd
map --mode editor e combine : exit_editor : launch --stdin-source=@screen_scrollback --type=overlay --title=current ~/.local/bin/nvim-scrollback
