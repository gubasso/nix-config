# ================================================================
# Kitty Copy Mode (ctrl+space>y)
# ================================================================
# Clipboard/hints operations.
#
# Hints (visual selection → clipboard):
#   w = word, l = line, p = path, u = url, h = hash
#
# Clipboard (quick copy):
#   y = full scrollback, ctrl+y = last command
#
# Mode auto-exits immediately on keypress. Esc to cancel.
# Press ? for help.
# ================================================================


action_alias hints_word kitten hints --type=word --program=@
action_alias hints_line kitten hints --type=line --program=@
action_alias hints_path kitten hints --type=path --program=@
action_alias hints_url  kitten hints --type=url --program=@
action_alias hints_hash kitten hints --type=hash --program=@

action_alias exit_copy_mode pop_keyboard_mode

# Enter copy mode via ctrl+space prefix
map --new-mode copy ctrl+space>y

# Help (exits mode first, so dismissing overlay returns to normal)
map --mode copy ? combine : exit_copy_mode : launch --type=overlay --title=Help ~/.local/bin/kitty-mode-help kitty-copy-mode.conf

# Exit
map --mode copy esc exit_copy_mode

# Hints
map --mode copy w combine : exit_copy_mode : hints_word
map --mode copy l combine : exit_copy_mode : hints_line
map --mode copy p combine : exit_copy_mode : hints_path
map --mode copy u combine : exit_copy_mode : hints_url
map --mode copy h combine : exit_copy_mode : hints_hash

# Quick clipboard
map --mode copy ctrl+y combine : exit_copy_mode : launch --stdin-source=@last_cmd_output sh -c '~/.local/bin/cat-lastcmd | kitten clipboard'
map --mode copy y combine : exit_copy_mode : launch --stdin-source=@screen_scrollback kitten clipboard
